name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build iOS Application (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Chrimastsatastracker.ipa Payload
          echo "Successfully created Chrimastsatastracker.ipa"
          ls -lh Chrimastsatastracker.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chrimastsatastracker-IPA
          path: Chrimastsatastracker.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-ios
          name: "Chrimastsatastracker iOS v1.0.0"
          body: "Chrimastsatastracker Christmas Santa Tracker iOS v1.0.0 IPA build. Compatible with iOS 15.0+ and ready for Sideloadly / AltStore / TrollStore installation."
          files: Chrimastsatastracker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
